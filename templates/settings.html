<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Akun - ShopAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='settings_style.css') }}">
</head>
<body>
    <div class="settings-container">
        <h2><i class="fas fa-cog"></i> Pengaturan Akun</h2>
        
        {% if message %}
            <div class="success-msg"><i class="fas fa-check-circle"></i> {{ message }}</div>
        {% endif %}
        
        <form method="POST" action="/settings">
            <div class="input-group">
                <label for="new_name">Nama Pengguna</label>
                <input type="text" id="new_name" name="new_name" value="{{ current_name }}" placeholder="Masukkan nama pengguna..." required autofocus>
            </div>
            <div class="input-group">
                <label for="new_email">Email Baru</label>
                <input type="email" id="new_email" name="new_email" value="{{ current_email }}" placeholder="Masukkan email..." required>
            </div>
            <div class="input-group">
                <label for="new_password">Password Baru</label>
                <input type="password" id="new_password" name="new_password" placeholder="Masukkan password baru..." required>
            </div>
            <button type="submit" class="btn-save">Simpan Perubahan</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

        <form method="POST" action="/delete_account" onsubmit="return confirm('Apakah Anda yakin ingin menghapus akun ini? Tindakan ini tidak dapat dibatalkan.');">
            <button type="submit" style="background-color: #d9534f; color: #ffffff; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; margin-bottom: 10px;">
                <i class="fas fa-trash-alt"></i> Hapus Akun
            </button>
        </form>
        
        <a href="/chat" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Chat</a>
    </div>
</body>
</html>
