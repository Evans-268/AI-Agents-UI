<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - ShopAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='data/Product/ai-profile.png') }}">
</head>
<body>
    <div class="login-container">
        <h2><i class="fas fa-user-plus"></i> Buat Akun</h2>
        
        {% if error %}
            <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/register">
            <div class="input-group">
                <label for="name">Nama Pengguna</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama pengguna..." required autofocus>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email..." required autofocus>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password..." required>
            </div>
            <button type="submit" class="btn-login">Daftar <i class="fas fa-user-check"></i></button>
        </form>

        <div class="register-link">
            Sudah punya akun? <a href="/login">Masuk</a>
        </div>
    </div>
</body>
</html>
